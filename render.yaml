services:
  - type: web
    name: task-api-web-jonathan
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: task_api
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_ISSUER
        value: task-api-express
      - key: JWT_AUDIENCE
        value: task-api-client
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
